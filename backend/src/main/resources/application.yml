server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: ai-table

  # ---------- MySQL ----------
  # 下面这些 ${XXX:默认值} 表示"优先读环境变量，读不到就用默认值"。
  # 默认值就是本机开发用的配置，所以本地跑不用改任何东西；
  # 用 Docker 跑时由 docker-compose.yml 通过环境变量传进来。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_table}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: AiTableHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ---------- JSON ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aitable.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# ---------- 业务配置 ----------
ai-table:
  # 管理员用户名（多个用逗号分隔）。用这些用户名登录时，账号会（自动）获得管理员角色，
  # 登录后就能看到管理后台。默认用 admin。
  admin-usernames: admin

  # 用户上传的文件（头像等）存哪里。相对路径是相对启动目录，
  # 用 java -jar 启动时就是 jar 所在的那个目录
  upload:
    dir: ./uploads

  room:
    # 房间里所有人都离线超过这么多秒，就自动关掉并删除这个房间，把资源释放出来。
    # 原来是 60 秒，太短了：玩完一局在结算面板看复盘时，如果电脑锁屏/休眠让
    # WebSocket 断开，回来就发现"房间已失效"。给足 10 分钟，正常人都够回来。
    idle-close-seconds: 600
    # 多久检查一次（毫秒）
    idle-check-interval-ms: 30000

  game:
    # 每个需要玩家操作的步骤最多等多少秒，超时自动跳过：
    #   夜晚 → 空刀 / 跳过查验 / 视为不用药
    #   发言 → 记为"（超时未发言）"轮到下一个人
    #   投票 → 未投票视为弃权
    action-timeout-seconds: 90
    # 多久扫描一次超时情况（毫秒）
    timeout-check-interval-ms: 2000

  # ---------- AI 玩家 ----------
  ai:
    # 用哪个"脑子"：
    #   rule = 规则 AI，不联网、免费、立刻能用（默认）
    #   llm  = 接大模型，需要环境变量 DEEPSEEK_API_KEY；调用失败会自动回退到规则 AI
    brain: llm

    # AI 每次行动之间隔多久（毫秒）。太快了玩家看不清它在干什么，
    # 像"唰"一下就过完一轮；调大就更从容，调小就更利索。
    action-delay-ms: 2000
    # AI 发言之后隔多久（毫秒）。要留够时间让人把这句话读完，所以比上面长。
    speak-delay-ms: 4000

    # "换场"时的停顿（毫秒）。
    # 什么算换场：夜晚 狼人→女巫→预言家 的交接、白天 发言→投票 的切换、白天↔夜晚 的转换。
    # 这些时刻必须留出明显停顿，让玩家看清"换人了 / 换阶段了"，
    # 否则 AI 一路做下来像瞬移，根本没反应过来就到下一轮了。
    phase-delay-ms: 5000

    # 投票阶段 AI 之间的间隔（毫秒）。
    # 投票是"大家一起投"—— 全部人要在 20 秒内投完（这个是引擎里的规则，
    # 对着 deadline 倒计时走），所以 AI 这里必须利索，
    # 不能套用上面那个 5 秒的换场停顿，否则 6 个人能拖半分钟。
    vote-delay-ms: 800

    # 局后复盘：一局结束让每个 AI 反省一句，下一局它会带着这个教训上场。
    #   开着：更像"活人"；每局结束要多花十几秒调大模型，
    #         但复盘是在**房间复位之后**才做的，不会耽误你立刻开下一局
    #   关掉：结算面板不显示复盘，跨局记忆里也就没有"上局的教训"
    reflection-enabled: true

    llm:
      base-url: https://api.deepseek.com
      # ★ 故意留空：Key 只从环境变量读，绝不写进这个文件 ——
      #   否则它会跟着代码一起进 Git 仓库，等于把 Key 公开了
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      # 单次调用最多等多少秒（超了就回退规则 AI，不让一桌人干等）
      timeout-seconds: 30
      # 高一点让 AI 的发言和选择有变化，不会每局都走同一条路
      temperature: 0.9

# ---------- 日志 ----------
logging:
  level:
    root: info
    com.aitable: debug
